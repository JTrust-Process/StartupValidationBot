spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/startup_validation_bot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway is the single schema authority (V1-V5). Hibernate must never mutate the schema at boot:
# web and worker start concurrently on deploy, and concurrent DDL from two JVMs is unsafe.
# Override with JPA_DDL_AUTO=none only if validation reports a benign type mismatch.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=60s

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

app.allowed-origins=${APP_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

radar.run-token=${RADAR_RUN_TOKEN:}
radar.auth.admin-password-hash=${RADAR_ADMIN_PASSWORD_HASH:}
radar.auth.browser-origin=${RADAR_BROWSER_ORIGIN:http://localhost:5173}
radar.auth.session-hours=${RADAR_AUTH_SESSION_HOURS:8}
radar.auth.secure-cookie=${RADAR_AUTH_SECURE_COOKIE:true}
radar.auth.same-site=${RADAR_AUTH_SAME_SITE:Strict}
radar.auth.max-login-attempts=${RADAR_AUTH_MAX_LOGIN_ATTEMPTS:5}
radar.auth.login-window-minutes=${RADAR_AUTH_LOGIN_WINDOW_MINUTES:15}
radar.auth.login-lockout-minutes=${RADAR_AUTH_LOGIN_LOCKOUT_MINUTES:15}
# The browser reaches the backend through the same-origin Vercel proxy, so the socket address is the
# proxy's. Trusting the forwarded client address keeps throttling per-client instead of locking the
# single legitimate user out globally. Set false if the backend is ever exposed without a proxy.
radar.auth.trust-forwarded-for=${RADAR_AUTH_TRUST_FORWARDED_FOR:true}
radar.auth.attempt-retention-hours=${RADAR_AUTH_ATTEMPT_RETENTION_HOURS:72}
radar.app-url=${RADAR_APP_URL:http://localhost:5173/#/radar}
radar.discovery-max-per-source=${RADAR_DISCOVERY_MAX_PER_SOURCE:30}
radar.job-lease-minutes=${RADAR_JOB_LEASE_MINUTES:120}
radar.demo-fixture.enabled=${RADAR_DEMO_FIXTURE_ENABLED:false}
radar.ai.enabled=${RADAR_ENABLE_AI:false}
radar.ai.provider=${AI_PROVIDER:groq}
radar.ai.groq-api-key=${GROQ_API_KEY:}
radar.ai.model=${RADAR_AI_MODEL:openai/gpt-oss-20b}
radar.ai.deep-dive-model=${RADAR_DEEP_DIVE_MODEL:openai/gpt-oss-120b}
radar.ai.max-items-per-run=${RADAR_AI_MAX_ITEMS_PER_RUN:25}
radar.ai.max-retries=${RADAR_AI_MAX_RETRIES:2}
radar.ai.prompt-version=${RADAR_AI_PROMPT_VERSION:radar-v2}
radar.ai.schema-version=${RADAR_AI_SCHEMA_VERSION:radar-analysis-v1}
radar.product-hunt-token=${PRODUCT_HUNT_TOKEN:}
radar.rss-urls=${RADAR_RSS_URLS:}
# Hacker News Launch/Show posts via the official public HN Search API. No key required.
radar.enable-hacker-news=${RADAR_ENABLE_HACKER_NEWS:true}
radar.deal-scout-run-url=${DEAL_SCOUT_RUN_URL:}
radar.deal-scout-token=${DEAL_SCOUT_RUN_TOKEN:}
radar.email-send-url=${RADAR_EMAIL_SEND_URL:${DEAL_SCOUT_EMAIL_ENDPOINT:}}
radar.email-token=${RADAR_EMAIL_TOKEN:${DEAL_SCOUT_RUN_TOKEN:}}
radar.time-zone=${RADAR_TIME_ZONE:America/New_York}
radar.discovery-cron=${RADAR_DISCOVERY_CRON:0 0 6 * * *}
radar.watchlist-cron=${RADAR_WATCHLIST_CRON:0 30 6 * * *}
radar.trends-cron=${RADAR_TRENDS_CRON:0 0 7 * * SUN}
radar.digest-cron=${RADAR_DIGEST_CRON:0 0 8 * * MON}
