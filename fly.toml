app = "startup-validation-bot-radar"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "java -jar /app/backend.jar --spring.main.web-application-type=none --spring.jpa.hibernate.ddl-auto=none --radar.migrate-only=true"

[processes]
  web = "java -jar /app/backend.jar"
  worker = "java -jar /app/backend.jar --spring.profiles.active=worker --spring.main.web-application-type=none"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/actuator/health/readiness"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
